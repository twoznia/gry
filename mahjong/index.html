<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Solitaire - Medieval</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../shared/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="back-link" href="../">← Wróć</a>
    <div id="lang-switcher">
        <button id="btn-lang-pl" type="button" aria-label="Polski">
            <img src="https://flagcdn.com/24x18/pl.png" width="24" height="18" alt="Polski">
        </button>
        <button id="btn-lang-en" type="button" aria-label="English">
            <img src="https://flagcdn.com/24x18/gb.png" width="24" height="18" alt="English">
        </button>
    </div>

    <div id="game-container">
        <header class="w-full max-w-5xl flex flex-col md:flex-row justify-between items-center px-3 py-2 mb-2 z-20 relative gap-2">
            <div class="text-center md:text-left heading-block">
                <h1 id="style-title" class="text-2xl font-bold medieval-font tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 to-amber-600">Mahjong</h1>
                <p class="text-sm stat-line" id="tiles-left-display"><span id="tiles-left-label">Klocki do usunięcia:</span> <span id="tiles-count" class="font-bold text-white">144</span></p>
                <p class="text-sm stat-line"><span id="time-label">Czas:</span> <span id="timer-display" class="font-bold text-white">00:00</span></p>
            </div>
            
            <div class="menu-layout">
                <div class="menu-row">
                <label class="control-label">
                    <span class="text-xs uppercase tracking-wider text-slate-400" id="style-label">Styl</span>
                    <select id="style-select" class="style-select"></select>
                </label>
                <label class="control-label">
                    <span class="text-xs uppercase tracking-wider text-slate-400" id="size-label">Rozmiar</span>
                    <div class="zoom-controls">
                        <button id="zoom-out" type="button" class="zoom-btn" aria-label="Pomniejsz">-</button>
                        <button id="zoom-reset" type="button" class="zoom-value">110%</button>
                        <button id="zoom-in" type="button" class="zoom-btn" aria-label="Powiększ">+</button>
                    </div>
                </label>
                <button onclick="startGame()" class="menu-action-btn menu-action-primary" id="new-game-btn">
                    Nowa Gra
                </button>
                <button id="show-scores-btn" type="button" class="menu-action-btn menu-action-secondary">
                    Wyniki
                </button>
                </div>

                <div class="menu-row">
                    <div class="hint-actions">
                        <button id="hint-toggle" type="button" class="hint-action-btn">Podświetlenie</button>
                        <button id="show-move-btn" type="button" class="hint-action-btn">Pokaż ruch</button>
                        <button id="undo-btn" type="button" class="hint-action-btn" disabled>Cofnij</button>
                    </div>
                <button onclick="shuffleRemaining()" id="btn-shuffle" class="menu-action-btn menu-action-warning">
                    Przetasuj
                </button>
                </div>
            </div>
        </header>

        <div id="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <div id="message-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="p-8 max-w-md w-full text-center transform scale-95 transition-transform duration-300 modal-card modal-warning" id="modal-content">
            <h2 id="modal-title" class="text-4xl medieval-font font-bold text-yellow-400 mb-4">Koniec Gry</h2>
            <p id="modal-message" class="text-slate-300 text-lg mb-8">Brak dostępnych ruchów.</p>
            <div class="flex justify-center gap-4">
                <button onclick="closeModal(); shuffleRemaining();" id="modal-btn-shuffle" class="px-6 py-3 font-bold rounded-xl shadow transition-colors hidden modal-btn modal-btn-warning">Przetasuj klocki</button>
                <button onclick="closeModal(); startGame();" id="modal-btn-replay" class="px-6 py-3 font-bold rounded-xl shadow transition-colors modal-btn modal-btn-primary">Zagraj ponownie</button>
            </div>
        </div>
    </div>

    <div id="leaderboard-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="p-8 max-w-2xl w-full text-center transform scale-95 transition-transform duration-300 modal-card modal-info" id="leaderboard-content">
            <h2 id="leaderboard-title" class="text-4xl medieval-font font-bold mb-3">Najlepsze wyniki</h2>
            <p id="leaderboard-message" class="text-lg">Top 10 wyników</p>
            <div id="leaderboard-list" class="results-list"></div>
            <p id="leaderboard-empty" class="results-empty hidden">Brak zapisanych wyników.</p>
            <div class="flex justify-center gap-4 mt-8">
                <button id="leaderboard-close-btn" type="button" class="px-6 py-3 font-bold rounded-xl shadow transition-colors modal-btn modal-btn-neutral">Zamknij</button>
                <button id="leaderboard-restart-btn" type="button" class="px-6 py-3 font-bold rounded-xl shadow transition-colors modal-btn modal-btn-primary">Nowa gra</button>
            </div>
        </div>
    </div>

    <div id="name-entry-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="p-8 rounded-2xl shadow-2xl max-w-md w-full text-center transform scale-95 transition-transform duration-300 modal-card modal-success">
            <h2 id="name-entry-title" class="text-4xl medieval-font font-bold mb-3">Zapisz wynik</h2>
            <p id="name-entry-message" class="text-slate-300 text-lg mb-6">Podaj imię do rankingu.</p>
            <input id="name-entry-input" type="text" maxlength="24" class="w-full px-4 py-3 rounded-xl border border-slate-600 bg-slate-900 text-slate-100 font-bold text-center outline-none focus:border-emerald-400" placeholder="Gracz">
            <div class="flex justify-center gap-4 mt-8">
                <button id="name-entry-skip-btn" type="button" class="px-6 py-3 font-bold rounded-xl shadow transition-colors modal-btn modal-btn-neutral">Pomiń</button>
                <button id="name-entry-save-btn" type="button" class="px-6 py-3 font-bold rounded-xl shadow transition-colors modal-btn modal-btn-primary">Zapisz</button>
            </div>
        </div>
    </div>

    <script src="styles-manifest.js"></script>
    <script src="script.js"></script>
</body>
</html>
