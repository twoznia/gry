<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Solitaire - Medieval</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans:wght@400;700&display=swap');

        :root {
            --tile-w-unit: 22px;
            --tile-h-unit: 30px;
            --tile-width: calc(var(--tile-w-unit) * 2);
            --tile-height: calc(var(--tile-h-unit) * 2);
            --board-width: 828px;
            --board-height: 568px;
        }

        body {
            background-color: #1a202c;
            color: #e2e8f0;
            font-family: 'Noto Sans', sans-serif;
            overflow-x: hidden;
            margin: 0;
            user-select: none;
        }

        .back-link {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 8px 14px;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover { background: #475569; }

        .medieval-font { font-family: 'Cinzel', serif; }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #2d3748 0%, #1a202c 100%);
            padding: 0.75rem 1rem 1rem;
        }

        #board-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 18px 40px 110px;
            perspective: 1900px;
            perspective-origin: 56% 78%;
            -webkit-overflow-scrolling: touch;
        }

        #board {
            position: relative;
            width: var(--board-width);
            height: var(--board-height);
            transform-origin: center top;
            transition: transform 0.3s ease;
        }

        .mahjong-tile {
            position: absolute;
            width: var(--tile-width);
            height: var(--tile-height);
            background-color: #cbd5e1;
            border-radius: 6px;
            border: 1px solid #475569;
            box-shadow: 2px 5px 10px rgba(15,23,42,0.34), inset -2px -2px 5px rgba(15,23,42,0.18), inset 2px 2px 5px rgba(255,255,255,0.38);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease, filter 0.2s, box-shadow 0.2s, opacity 0.3s ease-out;
            transform-style: preserve-3d;
            overflow: visible;
            pointer-events: none;
        }

        .mahjong-tile::before {
            content: '';
            position: absolute;
            top: calc(100% - 1px);
            left: 0;
            width: 100%;
            height: 12px;
            background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
            border-radius: 0 0 3px 3px;
            pointer-events: none;
            transform-origin: top;
            transform: skewX(-45deg);
            z-index: 0;
        }

        .mahjong-tile::after {
            content: '';
            position: absolute;
            top: 0;
            right: calc(100% - 1px);
            width: 12px;
            height: 100%;
            background: linear-gradient(180deg, #334155 0%, #0f172a 100%);
            box-shadow: inset -1px 0 0 rgba(255,255,255,0.08);
            pointer-events: none;
            transform-origin: right;
            transform: skewY(-45deg);
            z-index: 0;
        }

        .mahjong-tile.hide-bottom-wall::before,
        .mahjong-tile.hide-left-wall::after {
            opacity: 0;
        }

        .tile-hitbox {
            position: absolute;
            inset: 0;
            border: 0;
            padding: 0;
            margin: 0;
            background: transparent;
            border-radius: 6px;
            z-index: 3;
            cursor: pointer;
            pointer-events: auto;
        }

        .mahjong-tile.blocked { filter: brightness(0.65) contrast(0.9); cursor: not-allowed; z-index: 10; }
        .mahjong-tile.free { filter: brightness(1); }
        .mahjong-tile.free:hover,
        .mahjong-tile.free:has(.tile-hitbox:hover) { filter: brightness(1.1); }
        body.hints-disabled .mahjong-tile.blocked,
        body.hints-disabled .mahjong-tile.free,
        body.hints-disabled .mahjong-tile.free:hover {
            filter: brightness(1);
        }
        .mahjong-tile.selected {
            filter: brightness(1.2) sepia(0.3) hue-rotate(-20deg) saturate(1.5);
            transform: translateY(-5px);
            box-shadow: 0 0 15px 5px rgba(234, 179, 8, 0.6), 2px 7px 5px rgba(0,0,0,0.3);
            border-color: #eab308;
            z-index: calc(var(--tile-z-index, 0) + 1000) !important;
        }
        .mahjong-tile.removed { opacity: 0; pointer-events: none; transform: scale(1.5) translateZ(50px); }

        .tile-image-frame {
            position: absolute;
            inset: 4px;
            border-radius: 4px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.65);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.65), inset 0 0 12px rgba(15, 23, 42, 0.15);
            z-index: 1;
            pointer-events: none;
        }

        .tile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .style-select {
            min-width: 180px;
            padding: 0.5rem 0.75rem;
            border-radius: 0.75rem;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f8fafc;
            font-weight: 700;
        }

        .menu-layout {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            align-items: center;
            width: 100%;
        }

        .menu-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
        }

        .control-label {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            text-align: left;
            font-size: 0.875rem;
            font-weight: 700;
            color: #cbd5e1;
        }

        .panel-toggle {
            min-width: 180px;
            padding: 0.5rem 0.75rem;
            border-radius: 0.75rem;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f8fafc;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .style-select,
        .panel-toggle,
        .zoom-controls,
        .hint-action-btn,
        .menu-action-btn {
            min-height: 44px;
            box-sizing: border-box;
        }

        .panel-toggle .state-on { color: #86efac; }
        .panel-toggle .state-off { color: #fca5a5; }

        .hint-actions {
            display: flex;
            gap: 0.5rem;
            align-items: stretch;
            flex-wrap: wrap;
        }

        .hint-action-btn {
            padding: 0.5rem 0.75rem;
            border-radius: 0.75rem;
            border: 1px solid #475569;
            background: #1e293b;
            color: #f8fafc;
            font-weight: 700;
            white-space: nowrap;
        }

        .hint-action-btn:disabled,
        .menu-action-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .menu-action-btn {
            padding: 0.5rem 0.9rem;
            border-radius: 0.75rem;
            border: 1px solid transparent;
            color: #fff;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.2);
            transition: transform 0.15s ease, filter 0.15s ease;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .results-list {
            display: grid;
            gap: 0.6rem;
            margin: 1rem 0 0;
            text-align: left;
            max-height: 360px;
            overflow: auto;
        }

        .results-row {
            display: grid;
            grid-template-columns: 2.2rem 1fr auto auto;
            gap: 0.75rem;
            align-items: center;
            padding: 0.7rem 0.85rem;
            border-radius: 0.9rem;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(71, 85, 105, 0.55);
            color: #e2e8f0;
            font-size: 0.95rem;
        }

        .results-row strong {
            color: #f8fafc;
        }

        .results-rank {
            color: #fbbf24;
            font-weight: 800;
            text-align: center;
        }

        .results-empty {
            margin-top: 1rem;
            color: #94a3b8;
        }

        .zoom-controls {
            min-width: 180px;
            padding: 0.35rem 0.45rem;
            border-radius: 0.75rem;
            border: 1px solid #475569;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.45rem;
        }

        .zoom-btn {
            min-width: 2rem;
            height: 2rem;
            border: 1px solid #475569;
            border-radius: 0.65rem;
            background: #1e293b;
            color: #f8fafc;
            font-weight: 800;
            line-height: 1;
        }

        .zoom-value {
            min-width: 4rem;
            text-align: center;
            font-weight: 700;
            color: #f8fafc;
        }

        #message-modal { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); }
    </style>
</head>
<body>
    <a class="back-link" href="../">← Wróć</a>

    <div id="game-container">
        <header class="w-full max-w-4xl flex flex-col md:flex-row justify-between items-center bg-slate-800 px-4 py-3 rounded-xl shadow-lg border border-slate-700 mb-3 z-20 relative gap-3">
            <div class="text-center md:text-left mb-1 md:mb-0">
                <h1 id="style-title" class="text-3xl font-bold medieval-font tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 to-amber-600">Mahjong</h1>
                <p class="text-slate-400 text-sm" id="tiles-left-display">Klocki do usunięcia: <span id="tiles-count" class="font-bold text-white">144</span></p>
                <p class="text-slate-400 text-sm">Punkty: <span id="score-display" class="font-bold text-white">0</span></p>
                <p class="text-slate-400 text-sm">Czas: <span id="timer-display" class="font-bold text-white">00:00</span></p>
            </div>
            
            <div class="menu-layout">
                <div class="menu-row">
                <label class="control-label">
                    <span class="text-xs uppercase tracking-wider text-slate-400">Styl</span>
                    <select id="style-select" class="style-select"></select>
                </label>
                <label class="control-label">
                    <span class="text-xs uppercase tracking-wider text-slate-400">Rozmiar</span>
                    <div class="zoom-controls">
                        <button id="zoom-out" type="button" class="zoom-btn" aria-label="Pomniejsz">-</button>
                        <button id="zoom-reset" type="button" class="zoom-value">110%</button>
                        <button id="zoom-in" type="button" class="zoom-btn" aria-label="Powiększ">+</button>
                    </div>
                </label>
                <button onclick="startGame()" class="menu-action-btn bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500">
                    Nowa Gra
                </button>
                <button id="show-scores-btn" type="button" class="menu-action-btn bg-gradient-to-r from-slate-700 to-slate-600 hover:from-slate-600 hover:to-slate-500">
                    Wyniki
                </button>
                </div>

                <div class="menu-row">
                <label class="control-label">
                    <span class="text-xs uppercase tracking-wider text-slate-400">Podpowiedzi</span>
                    <div class="hint-actions">
                        <button id="hint-toggle" type="button" class="panel-toggle">
                            <span>Podśw.</span>
                            <span id="hint-toggle-state" class="state-on">Włączone</span>
                        </button>
                        <button id="show-move-btn" type="button" class="hint-action-btn">Pokaż ruch</button>
                        <button id="undo-btn" type="button" class="hint-action-btn" disabled>Cofnij</button>
                    </div>
                </label>
                <button onclick="shuffleRemaining()" id="btn-shuffle" class="menu-action-btn bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500">
                    Przetasuj
                </button>
                </div>
            </div>
        </header>

        <div id="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <div id="message-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-800 border-2 border-amber-500 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center transform scale-95 transition-transform duration-300" id="modal-content">
            <h2 id="modal-title" class="text-4xl medieval-font font-bold text-yellow-400 mb-4">Koniec Gry</h2>
            <p id="modal-message" class="text-slate-300 text-lg mb-8">Brak dostępnych ruchów.</p>
            <div class="flex justify-center gap-4">
                <button onclick="closeModal(); shuffleRemaining();" id="modal-btn-shuffle" class="px-6 py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl shadow transition-colors hidden">Przetasuj klocki</button>
                <button onclick="closeModal(); startGame();" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow transition-colors">Zagraj ponownie</button>
            </div>
        </div>
    </div>

    <div id="leaderboard-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-800 border-2 border-sky-500 p-8 rounded-2xl shadow-2xl max-w-2xl w-full text-center transform scale-95 transition-transform duration-300" id="leaderboard-content">
            <h2 id="leaderboard-title" class="text-4xl medieval-font font-bold text-sky-300 mb-3">Najlepsze wyniki</h2>
            <p id="leaderboard-message" class="text-slate-300 text-lg">Top 10 wyników</p>
            <div id="leaderboard-list" class="results-list"></div>
            <p id="leaderboard-empty" class="results-empty hidden">Brak zapisanych wyników.</p>
            <div class="flex justify-center gap-4 mt-8">
                <button id="leaderboard-close-btn" type="button" class="px-6 py-3 bg-slate-600 hover:bg-slate-500 text-white font-bold rounded-xl shadow transition-colors">Zamknij</button>
                <button id="leaderboard-restart-btn" type="button" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow transition-colors">Nowa gra</button>
            </div>
        </div>
    </div>

    <div id="name-entry-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-800 border-2 border-emerald-500 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center transform scale-95 transition-transform duration-300">
            <h2 class="text-4xl medieval-font font-bold text-emerald-300 mb-3">Zapisz wynik</h2>
            <p id="name-entry-message" class="text-slate-300 text-lg mb-6">Podaj imię do rankingu.</p>
            <input id="name-entry-input" type="text" maxlength="24" class="w-full px-4 py-3 rounded-xl border border-slate-600 bg-slate-900 text-slate-100 font-bold text-center outline-none focus:border-emerald-400" placeholder="Gracz">
            <div class="flex justify-center gap-4 mt-8">
                <button id="name-entry-skip-btn" type="button" class="px-6 py-3 bg-slate-600 hover:bg-slate-500 text-white font-bold rounded-xl shadow transition-colors">Pomiń</button>
                <button id="name-entry-save-btn" type="button" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow transition-colors">Zapisz</button>
            </div>
        </div>
    </div>

    <script src="styles-manifest.js"></script>
    <script>
        const LAYOUT_MAP = [
          { z: 0, tiles: [[0,4], [0,6], [0,8], [0,10], [0,12], [0,14], [0,16], [0,18], [0,20], [0,22], [0,24], [0,26], [2,8], [2,10], [2,12], [2,14], [2,16], [2,18], [2,20], [2,22], [4,6], [4,8], [4,10], [4,12], [4,14], [4,16], [4,18], [4,20], [4,22], [4,24], [6,4], [6,6], [6,8], [6,10], [6,12], [6,14], [6,16], [6,18], [6,20], [6,22], [6,24], [6,26], [7,2], [7,28], [7,30], [8,4], [8,6], [8,8], [8,10], [8,12], [8,14], [8,16], [8,18], [8,20], [8,22], [8,24], [8,26], [10,6], [10,8], [10,10], [10,12], [10,14], [10,16], [10,18], [10,20], [10,22], [10,24], [12,8], [12,10], [12,12], [12,14], [12,16], [12,18], [12,20], [12,22], [14,4], [14,6], [14,8], [14,10], [14,12], [14,14], [14,16], [14,18], [14,20], [14,22], [14,24], [14,26]] },
          { z: 1, tiles: [[2,10], [2,12], [2,14], [2,16], [2,18], [2,20], [4,10], [4,12], [4,14], [4,16], [4,18], [4,20], [6,10], [6,12], [6,14], [6,16], [6,18], [6,20], [8,10], [8,12], [8,14], [8,16], [8,18], [8,20], [10,10], [10,12], [10,14], [10,16], [10,18], [10,20], [12,10], [12,12], [12,14], [12,16], [12,18], [12,20]] },
          { z: 2, tiles: [[4,12], [4,14], [4,16], [4,18], [6,12], [6,14], [6,16], [6,18], [8,12], [8,14], [8,16], [8,18], [10,12], [10,14], [10,16], [10,18]] },
          { z: 3, tiles: [[6,14], [6,16], [8,14], [8,16]] },
          { z: 4, tiles: [[7,15]] }
        ];
        const LAYOUT_TILE_COUNT = LAYOUT_MAP.reduce((sum, layer) => sum + layer.tiles.length, 0);
        const STYLE_MANIFEST = window.MAHJONG_STYLE_MANIFEST || { styles: [] };
        const ZOOM_STORAGE_KEY = 'mahjong_zoom_level';
        const LEADERBOARD_STORAGE_KEY = 'mahjong_leaderboard_v1';
        const DEFAULT_ZOOM_LEVEL = 1.1;
        const MIN_ZOOM_LEVEL = 0.8;
        const MAX_ZOOM_LEVEL = 1.8;
        const ZOOM_STEP = 0.1;
        const VISUAL_LAYER_SHIFT_X = 12;
        const VISUAL_LAYER_SHIFT_Y = 12;
        const BOARD_VISUAL_PADDING_X = 8;
        const SCORE_PER_PAIR = 10;
        const MAX_LAYER_Z = LAYOUT_MAP.reduce((max, layer) => Math.max(max, layer.z), 0);

        let tilesOnBoard = [];
        let selectedTileRef = null;
        let deckBase = [];
        let selectedStyleId = null;
        let hintsEnabled = true;
        let zoomLevel = DEFAULT_ZOOM_LEVEL;
        let hintedTiles = [];
        let timerIntervalId = null;
        let elapsedSeconds = 0;
        let currentScore = 0;
        let gameCompleted = false;
        let pendingLeaderboardEntry = null;
        let undoState = null;

        const boardEl = document.getElementById('board');
        const countEl = document.getElementById('tiles-count');
        const scoreDisplayEl = document.getElementById('score-display');
        const timerDisplayEl = document.getElementById('timer-display');
        const modal = document.getElementById('message-modal');
        const modalContent = document.getElementById('modal-content');
        const leaderboardModalEl = document.getElementById('leaderboard-modal');
        const leaderboardTitleEl = document.getElementById('leaderboard-title');
        const leaderboardMessageEl = document.getElementById('leaderboard-message');
        const leaderboardListEl = document.getElementById('leaderboard-list');
        const leaderboardEmptyEl = document.getElementById('leaderboard-empty');
        const leaderboardCloseBtnEl = document.getElementById('leaderboard-close-btn');
        const leaderboardRestartBtnEl = document.getElementById('leaderboard-restart-btn');
        const nameEntryModalEl = document.getElementById('name-entry-modal');
        const nameEntryMessageEl = document.getElementById('name-entry-message');
        const nameEntryInputEl = document.getElementById('name-entry-input');
        const nameEntrySkipBtnEl = document.getElementById('name-entry-skip-btn');
        const nameEntrySaveBtnEl = document.getElementById('name-entry-save-btn');
        const styleSelectEl = document.getElementById('style-select');
        const styleTitleEl = document.getElementById('style-title');
        const hintToggleEl = document.getElementById('hint-toggle');
        const hintToggleStateEl = document.getElementById('hint-toggle-state');
        const showMoveBtnEl = document.getElementById('show-move-btn');
        const undoBtnEl = document.getElementById('undo-btn');
        const showScoresBtnEl = document.getElementById('show-scores-btn');
        const zoomOutEl = document.getElementById('zoom-out');
        const zoomInEl = document.getElementById('zoom-in');
        const zoomResetEl = document.getElementById('zoom-reset');

        function applyHintState() {
            document.body.classList.toggle('hints-disabled', !hintsEnabled);
            hintToggleStateEl.textContent = hintsEnabled ? 'Włączone' : 'Wyłączone';
            hintToggleStateEl.className = hintsEnabled ? 'state-on' : 'state-off';
            hintToggleEl.setAttribute('aria-pressed', hintsEnabled ? 'true' : 'false');
        }

        function toggleHints() {
            hintsEnabled = !hintsEnabled;
            applyHintState();
        }

        function clampZoom(level) {
            return Math.min(MAX_ZOOM_LEVEL, Math.max(MIN_ZOOM_LEVEL, level));
        }

        function saveZoomLevel() {
            localStorage.setItem(ZOOM_STORAGE_KEY, String(zoomLevel));
        }

        function updateZoomUI() {
            zoomResetEl.textContent = `${Math.round(zoomLevel * 100)}%`;
        }

        function setZoomLevel(nextLevel) {
            zoomLevel = clampZoom(Number(nextLevel) || DEFAULT_ZOOM_LEVEL);
            saveZoomLevel();
            updateZoomUI();
            adjustBoardScale();
        }

        function loadZoomLevel() {
            const stored = Number(localStorage.getItem(ZOOM_STORAGE_KEY));
            zoomLevel = Number.isFinite(stored) && stored > 0 ? clampZoom(stored) : DEFAULT_ZOOM_LEVEL;
            updateZoomUI();
        }

        function formatElapsedTime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            if (hours > 0) {
                return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function updateScoreDisplay() {
            scoreDisplayEl.textContent = String(currentScore);
        }

        function updateUndoButton() {
            undoBtnEl.disabled = !undoState;
        }

        function updateTimerDisplay() {
            timerDisplayEl.textContent = formatElapsedTime(elapsedSeconds);
        }

        function stopTimer() {
            if (timerIntervalId) {
                clearInterval(timerIntervalId);
                timerIntervalId = null;
            }
        }

        function startTimer() {
            stopTimer();
            timerIntervalId = setInterval(() => {
                elapsedSeconds += 1;
                updateTimerDisplay();
            }, 1000);
        }

        function resetTimer() {
            elapsedSeconds = 0;
            updateTimerDisplay();
        }

        function isAnyOverlayOpen() {
            return !modal.classList.contains('hidden') || !leaderboardModalEl.classList.contains('hidden') || !nameEntryModalEl.classList.contains('hidden');
        }

        function isGameActive() {
            return !gameCompleted && tilesOnBoard.some(tile => !tile.removed);
        }

        function loadLeaderboard() {
            try {
                const raw = localStorage.getItem(LEADERBOARD_STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch {
                return [];
            }
        }

        function saveLeaderboard(entries) {
            localStorage.setItem(LEADERBOARD_STORAGE_KEY, JSON.stringify(entries.slice(0, 10)));
        }

        function getSortedLeaderboard(entries) {
            return [...entries]
                .sort((left, right) => {
                    if (right.score !== left.score) return right.score - left.score;
                    if (left.elapsedSeconds !== right.elapsedSeconds) return left.elapsedSeconds - right.elapsedSeconds;
                    return left.name.localeCompare(right.name, 'pl');
                })
                .slice(0, 10);
        }

        function saveCurrentResult(name) {
            const entry = {
                name: (name || '').trim() || 'Gracz',
                score: currentScore,
                elapsedSeconds
            };
            const leaderboard = getSortedLeaderboard([...loadLeaderboard(), entry]);
            saveLeaderboard(leaderboard);
            return leaderboard;
        }

        function renderLeaderboard(entries) {
            leaderboardListEl.innerHTML = '';
            leaderboardEmptyEl.classList.toggle('hidden', entries.length > 0);

            entries.forEach((entry, index) => {
                const row = document.createElement('div');
                row.className = 'results-row';
                row.innerHTML = `
                    <div class="results-rank">${index + 1}</div>
                    <strong>${entry.name}</strong>
                    <span>${entry.score} pkt</span>
                    <span>${formatElapsedTime(entry.elapsedSeconds)}</span>
                `;
                leaderboardListEl.appendChild(row);
            });
        }

        function showLeaderboardModal(title = 'Najlepsze wyniki', message = 'Top 10 wyników', entries = loadLeaderboard()) {
            stopTimer();
            leaderboardTitleEl.textContent = title;
            leaderboardMessageEl.textContent = message;
            renderLeaderboard(entries);
            leaderboardModalEl.classList.remove('hidden', 'opacity-0');
        }

        function captureUndoState(kind) {
            undoState = {
                kind,
                score: currentScore,
                elapsedSeconds,
                tiles: tilesOnBoard.map(tile => ({
                    id: tile.id,
                    styleId: tile.styleId,
                    type: tile.type,
                    value: tile.value,
                    group: tile.group,
                    usageCount: tile.usageCount,
                    matchKey: tile.matchKey,
                    imageSrc: tile.imageSrc,
                    label: tile.label,
                    removed: tile.removed,
                    isSelected: false,
                    isHinted: false,
                    blockedLeftVisual: tile.blockedLeftVisual,
                    hasBottomNeighborVisual: tile.hasBottomNeighborVisual
                }))
            };
            updateUndoButton();
        }

        function restoreUndoState() {
            if (!undoState) return;

            clearHintedTiles();
            deselectCurrent();

            const snapshotById = new Map(undoState.tiles.map(tile => [tile.id, tile]));
            tilesOnBoard.forEach(tile => {
                const snapshot = snapshotById.get(tile.id);
                if (!snapshot) return;

                tile.styleId = snapshot.styleId;
                tile.type = snapshot.type;
                tile.value = snapshot.value;
                tile.group = snapshot.group;
                tile.usageCount = snapshot.usageCount;
                tile.matchKey = snapshot.matchKey;
                tile.imageSrc = snapshot.imageSrc;
                tile.label = snapshot.label;
                tile.removed = snapshot.removed;
                tile.isSelected = false;
                tile.isHinted = false;
                tile.blockedLeftVisual = snapshot.blockedLeftVisual;
                tile.hasBottomNeighborVisual = snapshot.hasBottomNeighborVisual;
                renderTileContent(tile, tile.element);
                const hitbox = tile.element.querySelector('.tile-hitbox');
                hitbox.addEventListener('click', (event) => {
                    event.stopPropagation();
                    const resolvedTile = findTopClickableTileAtPoint(tile, event.clientX, event.clientY) || tile;
                    handleTileClick(resolvedTile);
                });
            });

            currentScore = undoState.score;
            elapsedSeconds = undoState.elapsedSeconds;
            updateScoreDisplay();
            updateTimerDisplay();
            selectedTileRef = null;
            undoState = null;
            updateUndoButton();
            updateBoardState();
        }

        function closeLeaderboardModal() {
            leaderboardModalEl.classList.add('opacity-0');
            setTimeout(() => leaderboardModalEl.classList.add('hidden'), 300);
            if (isGameActive() && !isAnyOverlayOpen()) startTimer();
        }

        function showNameEntryModal() {
            stopTimer();
            nameEntryMessageEl.textContent = `Twój wynik: ${currentScore} pkt, ${formatElapsedTime(elapsedSeconds)}. Podaj imię do rankingu.`;
            nameEntryInputEl.value = '';
            nameEntryModalEl.classList.remove('hidden', 'opacity-0');
            setTimeout(() => nameEntryInputEl.focus(), 0);
        }

        function closeNameEntryModal() {
            nameEntryModalEl.classList.add('opacity-0');
            setTimeout(() => nameEntryModalEl.classList.add('hidden'), 300);
            if (isGameActive() && !isAnyOverlayOpen()) startTimer();
        }

        function submitLeaderboardEntry() {
            const leaderboard = saveCurrentResult(nameEntryInputEl.value);
            pendingLeaderboardEntry = null;
            closeNameEntryModal();
            showLeaderboardModal('Zwycięstwo!', `Twój wynik: ${currentScore} pkt, ${formatElapsedTime(elapsedSeconds)}`, leaderboard);
        }

        function handleVictory() {
            gameCompleted = true;
            stopTimer();
            pendingLeaderboardEntry = {
                score: currentScore,
                elapsedSeconds
            };
            showNameEntryModal();
        }

        function getStyleCatalog() {
            return (STYLE_MANIFEST.styles || []).slice();
        }

        function getSelectedStyle() {
            return getStyleCatalog().find(style => style.id === selectedStyleId) || null;
        }

        function updateStyleTitle() {
            const style = getSelectedStyle();
            const title = style ? `Mahjong ${style.name}` : 'Mahjong';
            document.title = `${title} - obrazki`;
            styleTitleEl.textContent = title;
        }

        function populateStyleSelector() {
            const styles = getStyleCatalog();
            styleSelectEl.innerHTML = '';

            styles.forEach(style => {
                const option = document.createElement('option');
                option.value = style.id;
                option.textContent = style.layoutCompatible ? `${style.name} (${style.tileCount})` : `${style.name} (${style.tileCount}, niezgodny)`;
                option.disabled = !style.layoutCompatible;
                styleSelectEl.appendChild(option);
            });

            const preferred = styles.find(style => style.id === selectedStyleId && style.layoutCompatible)
                || styles.find(style => style.layoutCompatible)
                || styles[0]
                || null;

            selectedStyleId = preferred ? preferred.id : null;
            if (preferred) styleSelectEl.value = preferred.id;
            updateStyleTitle();
        }

        function generateBaseDeck() {
            const style = getSelectedStyle();
            if (!style) return [];

            let deck = [];
            let idCounter = 0;
            style.items.forEach(item => {
                for (let i = 0; i < item.usageCount; i++) {
                    deck.push({
                        id: idCounter++,
                        styleId: style.id,
                        type: item.type,
                        value: item.name,
                        group: String(item.usageCount),
                        usageCount: item.usageCount,
                        matchKey: item.matchKey,
                        imageSrc: item.src,
                        label: item.label,
                        x: 0,
                        y: 0,
                        z: 0,
                        isFree: false,
                        isSelected: false,
                        isHinted: false,
                        blockedLeftVisual: false,
                        hasBottomNeighborVisual: false,
                        removed: false,
                        element: null
                    });
                }
            });
            return deck;
        }

        function syncTileClassName(tile, blockedLeft = tile.blockedLeftVisual, hasBottomNeighbor = tile.hasBottomNeighborVisual) {
            if (!tile.element) return;

            const classNames = ['mahjong-tile', tile.isFree ? 'free' : 'blocked'];
            if (blockedLeft) classNames.push('hide-left-wall');
            if (hasBottomNeighbor) classNames.push('hide-bottom-wall');
            if ((tile.isSelected || tile.isHinted) && !tile.removed) classNames.push('selected');
            if (tile.removed) classNames.push('removed');

            tile.element.className = classNames.join(' ');
        }

        function findTopClickableTileAtPoint(preferredTile, clientX, clientY) {
            const stack = document.elementsFromPoint(clientX, clientY);
            let topFreeTile = null;

            for (const element of stack) {
                const tileElement = element.classList?.contains('mahjong-tile')
                    ? element
                    : element.closest?.('.mahjong-tile');
                if (!tileElement) continue;

                const tile = tilesOnBoard.find(candidate => String(candidate.id) === tileElement.dataset.id);
                if (!tile || tile.removed || !tile.isFree) continue;
                if (tile === preferredTile) return topFreeTile || preferredTile;
                if (!topFreeTile) topFreeTile = tile;
            }

            return topFreeTile || preferredTile || null;
        }

        function clearHintedTiles() {
            hintedTiles.forEach(tile => {
                tile.isHinted = false;
                syncTileClassName(tile);
            });
            hintedTiles = [];
        }

        function findAvailableMove() {
            const freeTiles = tilesOnBoard.filter(tile => !tile.removed && tile.isFree);
            for (let i = 0; i < freeTiles.length; i++) {
                for (let j = i + 1; j < freeTiles.length; j++) {
                    if (tilesMatch(freeTiles[i], freeTiles[j])) {
                        return [freeTiles[i], freeTiles[j]];
                    }
                }
            }
            return null;
        }

        function showAvailableMove() {
            clearHintedTiles();
            deselectCurrent();
            const move = findAvailableMove();
            if (!move) return;

            hintedTiles = move;
            hintedTiles.forEach(tile => {
                tile.isHinted = true;
                syncTileClassName(tile);
            });
        }

        function init() {
            populateStyleSelector();
            loadZoomLevel();
            styleSelectEl.addEventListener('change', (event) => {
                selectedStyleId = event.target.value;
                updateStyleTitle();
                startGame();
            });
            deckBase = generateBaseDeck();
            adjustBoardScale();
            window.addEventListener('resize', adjustBoardScale);
            startGame();
        }

        function adjustBoardScale() {
            const wrapper = document.getElementById('board-wrapper');
            const board = document.getElementById('board');
            const boardWidth = board.offsetWidth || 828;
            const boardHeight = board.offsetHeight || 568;
            const wrapperRect = wrapper.getBoundingClientRect();
            const wrapperStyle = window.getComputedStyle(wrapper);
            const paddingX = parseFloat(wrapperStyle.paddingLeft) + parseFloat(wrapperStyle.paddingRight);
            const paddingY = parseFloat(wrapperStyle.paddingTop) + parseFloat(wrapperStyle.paddingBottom);
            const availableWidth = Math.max(240, wrapper.clientWidth - paddingX);
            const availableHeight = Math.max(240, window.innerHeight - wrapperRect.top - 16 - paddingY);
            const fitScale = Math.min(1, availableWidth / boardWidth);
            const scale = fitScale * zoomLevel;
            board.style.transform = `scale(${scale}) rotateX(-7deg) rotateY(5deg)`;

            const scaledWidth = boardWidth * scale;
            const scaledHeight = boardHeight * scale;
            const fitsViewport = scaledWidth <= availableWidth + 1 && scaledHeight <= availableHeight + 1;

            wrapper.style.maxHeight = `${Math.max(240, availableHeight + paddingY)}px`;
            wrapper.style.overflowX = fitsViewport ? 'hidden' : 'auto';
            wrapper.style.overflowY = fitsViewport ? 'hidden' : 'auto';
        }

        function startGame() {
            boardEl.innerHTML = '';
            selectedTileRef = null;
            clearHintedTiles();
            closeModal();
            closeLeaderboardModal();
            closeNameEntryModal();
            updateStyleTitle();
            deckBase = generateBaseDeck();
            gameCompleted = false;
            currentScore = 0;
            pendingLeaderboardEntry = null;
            undoState = null;
            updateScoreDisplay();
            updateUndoButton();
            resetTimer();
            startTimer();

            if (deckBase.length !== LAYOUT_TILE_COUNT) {
                countEl.innerText = deckBase.length;
                stopTimer();
                showModal('Styl niezgodny', `Styl wymaga ${LAYOUT_TILE_COUNT} tiles, ale znaleziono ${deckBase.length}.`, false);
                return;
            }

            let playDeck = [...deckBase].map(t => ({...t}));
            shuffleArray(playDeck);
            tilesOnBoard = [];
            let tileIndex = 0;
            
            LAYOUT_MAP.forEach(layer => {
                layer.tiles.forEach(coords => {
                    if (tileIndex < playDeck.length) {
                        let tile = playDeck[tileIndex];
                        tile.y = coords[0]; tile.x = coords[1]; tile.z = layer.z;
                        tilesOnBoard.push(tile);
                        tileIndex++;
                    }
                });
            });

            tilesOnBoard.forEach(tile => {
                const el = document.createElement('div');
                el.className = 'mahjong-tile';
                el.dataset.id = tile.id;
                const pxX = tile.x * 22; const pxY = tile.y * 30;
                const offsetZ_X = (tile.z * VISUAL_LAYER_SHIFT_X) + BOARD_VISUAL_PADDING_X;
                const offsetZ_Y = (MAX_LAYER_Z * VISUAL_LAYER_SHIFT_Y) - (tile.z * VISUAL_LAYER_SHIFT_Y);
                const tileZIndex = (tile.z * 100) + tile.x + tile.y;
                el.style.left = `${pxX + offsetZ_X}px`;
                el.style.top = `${pxY + offsetZ_Y}px`;
                el.style.setProperty('--tile-z-index', tileZIndex);
                el.style.zIndex = tileZIndex;
                renderTileContent(tile, el);
                const hitbox = el.querySelector('.tile-hitbox');
                hitbox.addEventListener('click', (event) => {
                    event.stopPropagation();
                    const resolvedTile = findTopClickableTileAtPoint(tile, event.clientX, event.clientY) || tile;
                    handleTileClick(resolvedTile);
                });
                tile.element = el;
                boardEl.appendChild(el);
            });
            updateBoardState();
        }

        function renderTileContent(tile, element) {
            element.innerHTML = `
                <button class="tile-hitbox" type="button" aria-label="Wybierz klocek ${tile.label}"></button>
                <div class="tile-image-frame">
                    <img class="tile-image" src="${tile.imageSrc}" alt="${tile.label}" loading="eager">
                </div>
            `;
        }

        function updateBoardState() {
            let activeCount = 0;
            tilesOnBoard.forEach(tile => {
                if (tile.removed) return;
                activeCount++;
                const isCovered = tilesOnBoard.some(other => !other.removed && other.z === tile.z + 1 && Math.abs(other.x - tile.x) < 2 && Math.abs(other.y - tile.y) < 2);
                let blockedLeft = false, blockedRight = false, hasBottomNeighbor = false;
                for (let other of tilesOnBoard) {
                    if (other.removed || other === tile || other.z !== tile.z) continue;
                    if (Math.abs(other.y - tile.y) < 2) {
                        if (other.x === tile.x - 2) blockedLeft = true;
                        if (other.x === tile.x + 2) blockedRight = true;
                    }
                    if (other.y === tile.y + 2 && Math.abs(other.x - tile.x) < 2) hasBottomNeighbor = true;
                }
                tile.isFree = !isCovered && (!blockedLeft || !blockedRight);
                tile.blockedLeftVisual = blockedLeft;
                tile.hasBottomNeighborVisual = hasBottomNeighbor;
                if (!tile.isFree && tile.isSelected) {
                    tile.isSelected = false;
                    if (selectedTileRef === tile) selectedTileRef = null;
                }
                syncTileClassName(tile, blockedLeft, hasBottomNeighbor);
            });
            countEl.innerText = activeCount;
            if (activeCount === 0) handleVictory();
            else checkAvailableMoves();
        }

        function handleTileClick(tile) {
            if (tile.removed || !tile.isFree) return;
            clearHintedTiles();
            if (selectedTileRef === tile) { deselectCurrent(); return; }
            if (selectedTileRef && (!selectedTileRef.isSelected || !selectedTileRef.element || selectedTileRef.removed || !selectedTileRef.isFree)) {
                selectedTileRef.isSelected = false;
                syncTileClassName(selectedTileRef);
                selectedTileRef = null;
            }
            if (selectedTileRef) {
                if (tilesMatch(selectedTileRef, tile)) removePair(selectedTileRef, tile);
                else { deselectCurrent(); selectTile(tile); }
            } else selectTile(tile);
        }

        function selectTile(tile) {
            tile.isSelected = true;
            selectedTileRef = tile;
            syncTileClassName(tile);
        }

        function deselectCurrent() {
            if (selectedTileRef) {
                selectedTileRef.isSelected = false;
                syncTileClassName(selectedTileRef);
            }
            selectedTileRef = null;
        }
        function tilesMatch(t1, t2) { return t1.matchKey === t2.matchKey; }
        function removePair(t1, t2) {
            clearHintedTiles();
            captureUndoState('pair');
            t1.isSelected = false;
            t2.isSelected = false;
            t1.removed = true; t2.removed = true;
            currentScore += SCORE_PER_PAIR;
            updateScoreDisplay();
            syncTileClassName(t1);
            syncTileClassName(t2);
            selectedTileRef = null;
            updateBoardState();
        }

        function checkAvailableMoves() {
            const freeTiles = tilesOnBoard.filter(t => !t.removed && t.isFree);
            let hasMove = false;
            for (let i = 0; i < freeTiles.length; i++) {
                for (let j = i + 1; j < freeTiles.length; j++) {
                    if (tilesMatch(freeTiles[i], freeTiles[j])) { hasMove = true; break; }
                }
            }
            if (!hasMove && freeTiles.length > 0) showModal("Brak ruchów", "Nie ma już żadnych pasujących, wolnych par.", true);
        }

        function shuffleRemaining() {
            clearHintedTiles();
            deselectCurrent();
            captureUndoState('shuffle');
            const remaining = tilesOnBoard.filter(t => !t.removed);
            let activeIdentities = remaining.map(t => ({
                styleId: t.styleId,
                type: t.type,
                value: t.value,
                group: t.group,
                usageCount: t.usageCount,
                matchKey: t.matchKey,
                imageSrc: t.imageSrc,
                label: t.label
            }));
            shuffleArray(activeIdentities);
            remaining.forEach((t, index) => {
                t.styleId = activeIdentities[index].styleId;
                t.type = activeIdentities[index].type;
                t.value = activeIdentities[index].value;
                t.group = activeIdentities[index].group;
                t.usageCount = activeIdentities[index].usageCount;
                t.matchKey = activeIdentities[index].matchKey;
                t.imageSrc = activeIdentities[index].imageSrc;
                t.label = activeIdentities[index].label;
                renderTileContent(t, t.element);
            });
            updateBoardState();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; }
        }

        function showModal(title, message, showShuffle) {
            stopTimer();
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-btn-shuffle').classList.toggle('hidden', !showShuffle);
            modal.classList.remove('hidden', 'opacity-0');
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
            if (isGameActive() && !isAnyOverlayOpen()) startTimer();
        }

        hintToggleEl.addEventListener('click', toggleHints);
        showMoveBtnEl.addEventListener('click', showAvailableMove);
        undoBtnEl.addEventListener('click', restoreUndoState);
        showScoresBtnEl.addEventListener('click', () => showLeaderboardModal());
        leaderboardCloseBtnEl.addEventListener('click', closeLeaderboardModal);
        leaderboardRestartBtnEl.addEventListener('click', () => {
            closeLeaderboardModal();
            startGame();
        });
        nameEntrySaveBtnEl.addEventListener('click', submitLeaderboardEntry);
        nameEntrySkipBtnEl.addEventListener('click', () => {
            nameEntryInputEl.value = 'Gracz';
            submitLeaderboardEntry();
        });
        nameEntryInputEl.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') submitLeaderboardEntry();
        });
        zoomOutEl.addEventListener('click', () => setZoomLevel(zoomLevel - ZOOM_STEP));
        zoomInEl.addEventListener('click', () => setZoomLevel(zoomLevel + ZOOM_STEP));
        zoomResetEl.addEventListener('click', () => setZoomLevel(DEFAULT_ZOOM_LEVEL));
        updateScoreDisplay();
        updateUndoButton();
        applyHintState();
        window.onload = init;
    </script>
</body>
</html>
