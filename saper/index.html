<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');

        :root {
            --cell-size-easy: clamp(30px, 8vw, 45px);
            --cell-size-med: clamp(20px, 5vw, 35px);
            --cell-size-hard: clamp(15px, 3vw, 25px);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            user-select: none; /* Prevent text selection while rapid clicking */
        }

        .game-container {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 95vw;
            overflow-x: auto; /* Handle wide hard mode board on smaller screens */
        }

        .header-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 12px 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border: inset 3px rgba(255, 255, 255, 0.1);
        }

        .digital-display {
            font-family: 'Roboto Mono', monospace;
            background: #111;
            color: #ef4444; /* Tailwind red-500 */
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 1.5rem;
            font-weight: 700;
            min-width: 80px;
            text-align: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        #board {
            display: grid;
            gap: 2px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px;
            border-radius: 8px;
            /* Grid template will be set by JS */
        }

        .cell {
            background: linear-gradient(to bottom right, #e2e8f0, #cbd5e1);
            border: 1px solid #94a3b8;
            border-top-color: #f8fafc;
            border-left-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: calc(var(--cell-size) * 0.6);
            cursor: pointer;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.5), inset -2px -2px 0px rgba(0,0,0,0.2);
            transition: filter 0.1s;
        }

        .cell:hover:not(.revealed) {
            filter: brightness(1.1);
        }

        .cell:active:not(.revealed) {
            border: 1px solid #94a3b8;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.3);
            background: #cbd5e1;
        }

        .cell.revealed {
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.1);
            cursor: default;
        }

        /* Number Colors */
        .cell[data-value="1"] { color: #2563eb; } /* Blue */
        .cell[data-value="2"] { color: #16a34a; } /* Green */
        .cell[data-value="3"] { color: #dc2626; } /* Red */
        .cell[data-value="4"] { color: #1e3a8a; } /* Dark Blue */
        .cell[data-value="5"] { color: #7f1d1d; } /* Dark Red */
        .cell[data-value="6"] { color: #0d9488; } /* Cyan */
        .cell[data-value="7"] { color: #000000; } /* Black */
        .cell[data-value="8"] { color: #52525b; } /* Gray */

        /* Special Cell States */
        .cell.mine {
            background-color: #ef4444;
            border-color: #dc2626;
        }
        
        .cell.flagged::after {
            content: '🚩';
            font-size: calc(var(--cell-size) * 0.5);
        }

        .cell.mine-revealed::after {
            content: '💣';
            font-size: calc(var(--cell-size) * 0.6);
        }
        
        .cell.wrong-flag::after {
            content: '❌';
            font-size: calc(var(--cell-size) * 0.6);
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        select, button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        select option {
            background: #1e293b;
            color: white;
        }

        select:hover, button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        button.primary {
            background: #3b82f6;
            border-color: #2563eb;
        }
        
        button.primary:hover {
            background: #2563eb;
        }

        #face-btn {
            font-size: 1.5rem;
            padding: 4px 12px;
            background: linear-gradient(to bottom, #f8fafc, #cbd5e1);
            color: black;
            border: 2px solid #94a3b8;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.8), inset -2px -2px 0px rgba(0,0,0,0.3);
            border-radius: 4px;
            cursor: pointer;
        }

        #face-btn:active {
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.4);
            background: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="mb-6 text-center">
        <h1 class="text-4xl font-extrabold tracking-tight mb-2">Saper</h1>
        <p class="text-sm text-slate-300 opacity-80">Klasyk w nowoczesnym wydaniu</p>
    </div>

    <div class="controls">
        <select id="difficulty-select">
            <option value="easy">Łatwy (9x9, 10 min)</option>
            <option value="medium">Średni (16x16, 40 min)</option>
            <option value="hard">Trudny (30x16, 99 min)</option>
        </select>
        <button id="new-game-btn" class="primary">Nowa Gra</button>
    </div>

    <div class="game-container">
        <div class="header-panel">
            <div id="mines-count" class="digital-display">010</div>
            <button id="face-btn">🙂</button>
            <div id="timer" class="digital-display">000</div>
        </div>

        <div id="board" oncontextmenu="return false;"></div>
    </div>
    
    <div class="mt-4 text-xs text-slate-300 opacity-60 text-center max-w-md">
        <p>Lewy klik (lub dotknięcie): Odsłoń pole.</p>
        <p>Prawy klik (lub długie przytrzymanie): Oznacz flagą 🚩.</p>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const difficultySelect = document.getElementById('difficulty-select');
        const newGameBtn = document.getElementById('new-game-btn');
        const faceBtn = document.getElementById('face-btn');
        const minesCountDisplay = document.getElementById('mines-count');
        const timerDisplay = document.getElementById('timer');

        // Game Configuration
        const config = {
            easy: { rows: 9, cols: 9, mines: 10, cssVar: '--cell-size-easy' },
            medium: { rows: 16, cols: 16, mines: 40, cssVar: '--cell-size-med' },
            hard: { rows: 16, cols: 30, mines: 99, cssVar: '--cell-size-hard' }
        };

        let currentConfig = config.easy;
        let board = []; // 2D array storing cell data
        let gameActive = false;
        let firstClick = true;
        let minesLeft = 0;
        let cellsRevealed = 0;
        
        // Timer variables
        let timerInterval;
        let secondsElapsed = 0;

        // Long press handling for mobile flags
        let longPressTimer;
        const LONG_PRESS_DURATION = 400; // ms

        function initGame() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            updateTimerDisplay();
            
            const difficulty = difficultySelect.value;
            currentConfig = config[difficulty];
            
            minesLeft = currentConfig.mines;
            updateMinesDisplay();
            
            gameActive = true;
            firstClick = true;
            cellsRevealed = 0;
            faceBtn.innerText = '🙂';
            board = [];
            
            renderEmptyBoard();
        }

        function renderEmptyBoard() {
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${currentConfig.cols}, 1fr)`;
            boardEl.style.gridTemplateRows = `repeat(${currentConfig.rows}, 1fr)`;
            
            // Set CSS variable for cell size based on difficulty to fit screen
            document.documentElement.style.setProperty('--cell-size', `var(${currentConfig.cssVar})`);

            for (let r = 0; r < currentConfig.rows; r++) {
                let row = [];
                for (let c = 0; c < currentConfig.cols; c++) {
                    const cellData = {
                        r: r,
                        c: c,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0,
                        element: null
                    };
                    
                    const cellEl = document.createElement('div');
                    cellEl.classList.add('cell');
                    cellEl.style.width = 'var(--cell-size)';
                    cellEl.style.height = 'var(--cell-size)';
                    cellEl.dataset.r = r;
                    cellEl.dataset.c = c;
                    
                    // Event Listeners
                    setupCellEvents(cellEl, r, c);

                    cellData.element = cellEl;
                    boardEl.appendChild(cellEl);
                    row.push(cellData);
                }
                board.push(row);
            }
        }

        function setupCellEvents(cellEl, r, c) {
            // Left click
            cellEl.addEventListener('mousedown', (e) => {
                if (e.button !== 0 || !gameActive) return;
                faceBtn.innerText = '😮'; // Surprise face while clicking
            });

            cellEl.addEventListener('mouseup', (e) => {
                if (e.button !== 0 || !gameActive) return;
                faceBtn.innerText = '🙂';
                handleReveal(r, c);
            });

            // Right click (Flag)
            cellEl.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                if (!gameActive) return;
                handleFlag(r, c);
            });

            // Touch events for mobile (Long press to flag)
            cellEl.addEventListener('touchstart', (e) => {
                if (!gameActive) return;
                faceBtn.innerText = '😮';
                longPressTimer = setTimeout(() => {
                    handleFlag(r, c);
                    longPressTimer = null; // Prevent reveal if flagged via long press
                    // Visual feedback for mobile
                    navigator.vibrate && navigator.vibrate(50);
                }, LONG_PRESS_DURATION);
            }, {passive: true});

            cellEl.addEventListener('touchend', (e) => {
                if (!gameActive) return;
                faceBtn.innerText = '🙂';
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    // It was a short tap, so reveal
                    // Small delay to ensure it wasn't a swipe
                    setTimeout(() => handleReveal(r, c), 10);
                }
                // Prevent default mouse events triggering after touch
                e.preventDefault(); 
            });
            
            cellEl.addEventListener('touchmove', () => {
                // Cancel long press if user is scrolling
                if (longPressTimer) clearTimeout(longPressTimer);
            }, {passive: true});
        }

        function placeMines(safeR, safeC) {
            let minesPlaced = 0;
            while (minesPlaced < currentConfig.mines) {
                let r = Math.floor(Math.random() * currentConfig.rows);
                let c = Math.floor(Math.random() * currentConfig.cols);

                // Conditions to NOT place a mine:
                // 1. Already a mine
                // 2. It's the exact cell clicked (safeR, safeC)
                // 3. It's an immediate neighbor of the clicked cell (ensure 0 start)
                if (!board[r][c].isMine && !isNeighborOrSelf(r, c, safeR, safeC)) {
                    board[r][c].isMine = true;
                    minesPlaced++;
                }
            }
            calculateNeighbors();
        }

        function isNeighborOrSelf(r1, c1, r2, c2) {
            return Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1;
        }

        function calculateNeighbors() {
            for (let r = 0; r < currentConfig.rows; r++) {
                for (let c = 0; c < currentConfig.cols; c++) {
                    if (!board[r][c].isMine) {
                        let count = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                let nr = r + dr;
                                let nc = c + dc;
                                if (isValid(nr, nc) && board[nr][nc].isMine) {
                                    count++;
                                }
                            }
                        }
                        board[r][c].neighborMines = count;
                    }
                }
            }
        }

        function isValid(r, c) {
            return r >= 0 && r < currentConfig.rows && c >= 0 && c < currentConfig.cols;
        }

        function handleReveal(r, c) {
            const cell = board[r][c];
            
            if (cell.isRevealed || cell.isFlagged) return;

            if (firstClick) {
                placeMines(r, c);
                firstClick = false;
                startTimer();
            }

            if (cell.isMine) {
                gameOver(false, cell);
                return;
            }

            revealCell(r, c);
            checkWin();
        }

        function handleFlag(r, c) {
            const cell = board[r][c];
            if (cell.isRevealed) return;

            if (!cell.isFlagged && minesLeft > 0) {
                cell.isFlagged = true;
                cell.element.classList.add('flagged');
                minesLeft--;
            } else if (cell.isFlagged) {
                cell.isFlagged = false;
                cell.element.classList.remove('flagged');
                minesLeft++;
            }
            updateMinesDisplay();
        }

        function revealCell(r, c) {
            const cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            cell.element.classList.add('revealed');
            cellsRevealed++;

            if (cell.neighborMines > 0) {
                cell.element.dataset.value = cell.neighborMines;
                cell.element.innerText = cell.neighborMines;
            } else {
                // Flood fill for empty cells (0 mines around)
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr;
                        let nc = c + dc;
                        if (isValid(nr, nc)) {
                            revealCell(nr, nc); // Recursive call
                        }
                    }
                }
            }
        }

        function checkWin() {
            const totalSafeCells = (currentConfig.rows * currentConfig.cols) - currentConfig.mines;
            if (cellsRevealed === totalSafeCells) {
                gameOver(true);
            }
        }

        function gameOver(isWin, deathCell = null) {
            gameActive = false;
            clearInterval(timerInterval);

            if (isWin) {
                faceBtn.innerText = '😎';
                minesLeft = 0; // Flag remaining implicitly
                updateMinesDisplay();
                // Flag all remaining mines visually
                for (let r = 0; r < currentConfig.rows; r++) {
                    for (let c = 0; c < currentConfig.cols; c++) {
                        let cell = board[r][c];
                        if (cell.isMine && !cell.isFlagged) {
                            cell.element.classList.add('flagged');
                        }
                    }
                }
            } else {
                faceBtn.innerText = '😵';
                // Reveal all mines and show mistakes
                for (let r = 0; r < currentConfig.rows; r++) {
                    for (let c = 0; c < currentConfig.cols; c++) {
                        let cell = board[r][c];
                        if (cell.isMine && !cell.isFlagged) {
                            cell.element.classList.add('revealed', 'mine-revealed');
                        } else if (!cell.isMine && cell.isFlagged) {
                            // Wrong flag placed
                            cell.element.classList.add('revealed', 'wrong-flag');
                            cell.element.classList.remove('flagged');
                        }
                    }
                }
                // Highlight the mine that killed the player
                if (deathCell) {
                    deathCell.element.classList.add('mine'); 
                }
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (secondsElapsed < 999) {
                    secondsElapsed++;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            timerDisplay.innerText = secondsElapsed.toString().padStart(3, '0');
        }

        function updateMinesDisplay() {
            // Handle negative display if user places too many flags
            const sign = minesLeft < 0 ? "-" : "";
            const absVal = Math.abs(minesLeft);
            minesCountDisplay.innerText = sign + absVal.toString().padStart(minesLeft < 0 ? 2 : 3, '0');
        }

        // Event Listeners for UI
        newGameBtn.addEventListener('click', initGame);
        faceBtn.addEventListener('click', initGame);
        difficultySelect.addEventListener('change', initGame);

        // Start initial game
        initGame();

    </script>
</body>
</html>
