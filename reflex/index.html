<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szybka Reakcja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Inter', sans-serif; }
        .back-link { position: fixed; top: 10px; left: 10px; z-index: 100; background: #334155; color: #fff; border: 1px solid #475569; border-radius: 8px; padding: 8px 14px; text-decoration: none; font-size: 13px; }
        .back-link:hover { background: #475569; }
        .variant-card { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 1.25rem; padding: 2rem 2.5rem; text-decoration: none; transition: transform 0.15s, box-shadow 0.15s; border: 2px solid transparent; }
        .variant-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
        .variant-icon { font-size: 4rem; line-height: 1; font-weight: 900; letter-spacing: -2px; margin-bottom: 0.75rem; font-family: 'Inter', monospace; }
        .card-numbers { background: linear-gradient(135deg, #1e3a5f 0%, #1e293b 100%); border-color: #3b82f6; }
        .card-numbers .variant-icon { color: #60a5fa; text-shadow: 0 0 20px rgba(96,165,250,0.5); }
        .card-numbers:hover { border-color: #60a5fa; }
        .card-letters { background: linear-gradient(135deg, #3b1f5f 0%, #1e293b 100%); border-color: #a855f7; }
        .card-letters .variant-icon { color: #c084fc; text-shadow: 0 0 20px rgba(192,132,252,0.5); }
        .card-letters:hover { border-color: #c084fc; }
        .card-colors { background: linear-gradient(135deg, #5f2a1f 0%, #1e293b 100%); border-color: #f97316; }
        .card-colors .variant-icon { font-size: 2.5rem; letter-spacing: 2px; text-shadow: 0 0 20px rgba(249,115,22,0.5); }
        .card-colors:hover { border-color: #fb923c; }
    </style>
</head>
<body>
<a class="back-link" href="../">← Wróć</a>

<div class="text-center px-4 w-full max-w-2xl">
    <h1 class="text-4xl font-extrabold mb-2 text-white tracking-tight">⚡ Szybka Reakcja</h1>
    <p class="text-slate-400 text-lg mb-10">Wybierz wariant gry</p>

    <div class="flex flex-col sm:flex-row gap-6 justify-center">

        <a href="./liczby/" class="variant-card card-numbers flex-1">
            <div class="variant-icon">123</div>
            <h2 class="text-2xl font-bold text-white mb-1">Liczby</h2>
            <p class="text-slate-400 text-sm text-center">Klikaj kółka z liczbami w odpowiedniej kolejności</p>
            <div class="mt-4 bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-2 rounded-xl text-sm transition-colors">Zagraj</div>
        </a>

        <a href="./litery/" class="variant-card card-letters flex-1">
            <div class="variant-icon">ABC</div>
            <h2 class="text-2xl font-bold text-white mb-1">Litery</h2>
            <p class="text-slate-400 text-sm text-center">Klikaj kółka z literami w kolejności alfabetycznej</p>
            <div class="mt-4 bg-purple-600 hover:bg-purple-500 text-white font-bold px-6 py-2 rounded-xl text-sm transition-colors">Zagraj</div>
        </a>

        <a href="./kolory/" class="variant-card card-colors flex-1">
            <div class="variant-icon">🔴🔵🟢</div>
            <h2 class="text-2xl font-bold text-white mb-1">Kolory</h2>
            <p class="text-slate-400 text-sm text-center">Klikaj kółka w kolejności kolorów z listy</p>
            <div class="mt-4 bg-orange-600 hover:bg-orange-500 text-white font-bold px-6 py-2 rounded-xl text-sm transition-colors">Zagraj</div>
        </a>

    </div>
</div>

</body>
</html>
