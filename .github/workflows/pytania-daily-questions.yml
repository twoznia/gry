name: Pytania — codzienne pytania AI

# Codziennie generuje porcję pytań do gry "pytania" i otwiera Pull Request
# do ręcznego przejrzenia i scalenia. Można też uruchomić ręcznie z wybraną
# liczbą pytań przez "Run workflow".
#
# Wymaga sekretu repozytorium: ANTHROPIC_API_KEY

on:
  schedule:
    - cron: '0 6 * * *'   # codziennie o 06:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: 'Ile pytań wygenerować'
        required: false
        default: '200'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'

      - name: Generate questions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Brak sekretu ANTHROPIC_API_KEY — ustaw go w Settings → Secrets → Actions."
            exit 1
          fi
          node pytania/tools/add_questions.mjs --count "${{ github.event.inputs.count || '200' }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: pytania/auto-questions
          commit-message: "Pytania: codzienna porcja pytań AI"
          title: "Pytania: codzienna porcja pytań AI (${{ github.run_id }})"
          body: |
            Automatycznie wygenerowane pytania dodane do `pytania/dane/pytania.csv`.

            Przejrzyj nowe wiersze (na końcu pliku) i scal, jeśli wyglądają poprawnie.
          add-paths: |
            pytania/dane/pytania.csv
          delete-branch: true
